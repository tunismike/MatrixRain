[Settings]
# Visual Effects
# Ripples are the most CPU-intensive effect (morphing waves)
EnableRipples = false
# Cascades are moderate CPU usage (highlight waves)
EnableCascades = false
# These are cheap - just overlays
EnableHaze = true
EnableCrtGrid = true

# Layout
ForegroundSpacing = 14

# Performance
# Higher = better performance but more color banding (16-32 recommended)
ColorQuantizationStep = 24
# Lower FPS = less CPU. 30 is smooth enough for a wallpaper
TargetFPS = 30
# When FPS drops below this, effects auto-disable
AdaptiveThreshold = 25

# Desktop Wallpaper Mode
# When enabled, Matrix Rain runs BEHIND all windows like a live wallpaper
# To quit: use Activity Monitor or run 'pkill -f matrix_rain'
WallpaperMode = true

[Screensaver]
# Page the screensaver renders. Relative to this directory, or absolute.
# Blank or missing file = the bundled index.html (our canvas renderer).
HtmlPath = rezmason/canon.html

# Time in seconds before the screensaver activates
IdleTimeSeconds = 180
# Set to false to disable the screensaver functionality entirely
Enabled = True

# Smooth fade-in / fade-out duration in seconds (0 = instant cut)
FadeInSeconds = 0.35
FadeOutSeconds = 0.15

# Optional cap (seconds) before releasing the display-sleep assertion so macOS
# can sleep the displays. 0 = keep displays awake indefinitely while plugged in.
MaxDurationSeconds = 0

# Allow displays to sleep normally when running on battery power
AllowDisplaySleepOnBattery = True

# Set to True to skip launching while another app prevents display sleep (video/calls)
RespectDisplaySleepAssertions = False
IgnoreAssertionProcesses = Antigravity,RustDesk
