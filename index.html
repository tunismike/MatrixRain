<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Rain FX</title>
  <style>
    @font-face {
      font-family: 'MatrixFont';
      src: url('fonts/matrix.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Pulsing vignette overlay — CSS-only, zero JS cost */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: radial-gradient(ellipse at center,
          transparent 40%,
          rgba(0, 0, 0, 0.5) 80%,
          rgba(0, 0, 0, 0.85) 100%);
      animation: vignettePulse 8s ease-in-out infinite alternate;
    }

    @keyframes vignettePulse {
      0% {
        opacity: 0.6;
      }

      100% {
        opacity: 1.0;
      }
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>
  <!-- Bloom composite layer -->
  <canvas id="bloom" style="z-index:2; mix-blend-mode: screen; opacity: 0.5; pointer-events:none;"></canvas>
  <!-- CSS vignette -->
  <div id="vignette"></div>
  <script>
    // ============================================================================
    // MATRIX RAIN FX — JavaScript/HTML5 Canvas Port
    // Faithful 1:1 port of matrix_rain.py
    // ============================================================================

    // --- General Configuration ---
    const FRAME_RATE = 60; // used only for adaptive threshold reference
    const BACKGROUND_COLOR = [0, 0, 0];
    const FONT_STRETCH_FACTOR = 1.25;

    // --- Green Haze/Fog Overlay ---
    const HAZE_ENABLED = true;
    const HAZE_COLOR = [0, 255, 0];
    const HAZE_ALPHA = 10; // out of 255

    // --- CRT Scanlines Overlay ---
    const CRT_GRID_ENABLED = true;
    const CRT_SCANLINE_SPACING = 2;
    const CRT_SCANLINE_ALPHA = 60; // out of 255

    // --- General Streak Behavior ---
    const LEADER_BRIGHTNESS_SPEED_MULTIPLIER = 1;
    const SLOWEST_LEADER_FLICKER_INTERVAL_MS = 600;
    const FASTEST_LEADER_FLICKER_INTERVAL_MS = 4;
    const FLICKER_SPEED_CURVE_EXPONENT = 1.3;
    const SPEED_DISTRIBUTION_BIAS = 2.5;
    const LEADER_EXTRA_BOLDNESS = 2;

    // --- Variable Speed ---
    const VARIABLE_SPEED_ENABLED = true;
    const SPEED_CHANGE_INTERVAL_RANGE = [0.1, 0.5];
    const SPEED_CHANGE_AMOUNT = 0.3;

    // --- Riding Cascade Effect ---
    let CASCADES_ENABLED = false; // matches config.ini
    const CASCADE_CHANCE_PER_SECOND = 0.25;
    const CASCADE_RADIUS_PPS = 500;
    const CASCADE_MAX_RADIUS = 500;
    const CASCADE_FADE_IN_TIME_MS = 250;
    const DARK_CASCADE_CHANCE = 0.5;
    const CASCADE_BRIGHTNESS_BOOST = 1;
    const CASCADE_FADE_LENGTH = 10;
    const CASCADE_SPEED_CPS = 20;

    // --- Morphing Ripple Effect ---
    let RIPPLES_ENABLED = false; // matches config.ini
    const RIPPLE_CHANCE_PER_SECOND = 0.25;
    const RIPPLE_RADIUS_PPS = 120;
    const RIPPLE_MAX_RADIUS = 700;
    const RIPPLE_FADE_IN_TIME_MS = 2000;
    const RIPPLE_FADE_OUT_TIME_S = 5.0;
    const RIPPLE_BRIGHTNESS_BOOST = 1.3;
    const RIPPLE_DISTORTION_FREQUENCY = 5.0;
    const RIPPLE_DISTORTION_AMPLITUDE = 80.0;
    const RIPPLE_DISTORTION_SPEED = 1.0;

    // --- Foreground Layer ---
    const FG_IS_BOLD = false;
    const FG_FONT_SIZE = 18;
    const FG_LINE_HEIGHT_MULTIPLIER = 1.1;
    const FG_STREAM_SPACING = 14; // matches config.ini ForegroundSpacing
    const FG_SPEED_RANGE = [10, 300];
    const FG_LENGTH_RANGE = [5, 70];
    const FG_DORMANCY_RANGE = [0, 1000];
    const FG_FLICKER_CHANCE = 0.04;
    const FG_LEADER_COLOR = [255, 255, 255];
    const FG_TRAIL_COLOR = [50, 180, 120];
    const FG_CHAR_LIST = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabdefghijklmnopqrstuvwx____".split('');
    const FG_HIGHLIGHT_HALO_SIZE = 8;
    const FG_SECOND_CHAR_COLOR = [80, 255, 160];

    // --- Adaptive Quality ---
    const ADAPTIVE_THRESHOLD = 25; // matches config.ini
    const COLOR_QUANTIZATION_STEP = 24; // matches config.ini

    // ============================================================================
    // UTILITY FUNCTIONS
    // ============================================================================

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randFloat(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(v, lo, hi) {
      return v < lo ? lo : v > hi ? hi : v;
    }

    function quantizeColor(r, g, b, step) {
      return [
        clamp(Math.round(r / step) * step, 0, 255),
        clamp(Math.round(g / step) * step, 0, 255),
        clamp(Math.round(b / step) * step, 0, 255)
      ];
    }

    function lerpColor(c1, c2, t) {
      return [
        clamp(Math.round(c1[0] + (c2[0] - c1[0]) * t), 0, 255),
        clamp(Math.round(c1[1] + (c2[1] - c1[1]) * t), 0, 255),
        clamp(Math.round(c1[2] + (c2[2] - c1[2]) * t), 0, 255)
      ];
    }

    function colorToCSS(r, g, b, a) {
      if (a !== undefined) return `rgba(${r},${g},${b},${a})`;
      return `rgb(${r},${g},${b})`;
    }

    function distSqPointToVerticalSegment(px, py, segX, segY1, segY2) {
      if (segY1 > segY2) { [segY1, segY2] = [segY2, segY1]; }
      const qy = Math.max(segY1, Math.min(py, segY2));
      return (px - segX) ** 2 + (py - qy) ** 2;
    }

    // ============================================================================
    // HIGHLIGHT CASCADE
    // ============================================================================

    class HighlightCascade {
      constructor(originX, originY, isDark) {
        this.originX = originX;
        this.originY = originY;
        this.isDark = isDark;
        this.currentRadius = 0;
        this.speed = CASCADE_RADIUS_PPS;
        this.maxRadius = CASCADE_MAX_RADIUS;
        this.triggeredColumns = new Set();
      }
    }

    class HighlightCascadeManager {
      constructor(columns) {
        this.columns = columns;
        this.activeCascades = [];
      }

      _startNewCascade() {
        const eligible = this.columns.filter(c =>
          c.dormantCounter <= 0 && c.leaderPosFloat > 0 && c.leaderPosFloat < c.numChars
        );
        if (eligible.length === 0) return;
        const col = eligible[randInt(0, eligible.length - 1)];
        const originX = col.x;
        const originY = col.leaderPosFloat * col.lineHeight;
        const isDark = Math.random() < DARK_CASCADE_CHANCE;
        this.activeCascades.push(new HighlightCascade(originX, originY, isDark));
      }

      update(dt) {
        if (Math.random() < CASCADE_CHANCE_PER_SECOND * dt) {
          this._startNewCascade();
        }

        for (let ci = this.activeCascades.length - 1; ci >= 0; ci--) {
          const cascade = this.activeCascades[ci];
          cascade.currentRadius += cascade.speed * dt;
          const radiusSq = cascade.currentRadius * cascade.currentRadius;

          for (const column of this.columns) {
            if (Math.abs(cascade.originX - column.x) > cascade.currentRadius) continue;
            if (cascade.triggeredColumns.has(column) || column.dormantCounter > 0 || column.trailLength <= 1) continue;

            const leaderInt = Math.floor(column.leaderPosFloat);
            if (leaderInt < 0 || leaderInt >= column.numChars) continue;

            const trailTopY = (leaderInt - column.trailLength + 1) * column.lineHeight;
            const trailBottomY = leaderInt * column.lineHeight;
            const dSq = distSqPointToVerticalSegment(cascade.originX, cascade.originY, column.x, trailTopY, trailBottomY);

            if (dSq <= radiusSq) {
              column.triggerCascade(cascade.originY, cascade.isDark);
              cascade.triggeredColumns.add(column);
            }
          }

          if (cascade.currentRadius > cascade.maxRadius) {
            this.activeCascades.splice(ci, 1);
          }
        }
      }
    }

    // ============================================================================
    // RIPPLE
    // ============================================================================

    class Ripple {
      constructor(originX, originY) {
        this.originX = originX;
        this.originY = originY;
        this.currentRadius = 0;
        this.age = 0;
        this.speed = RIPPLE_RADIUS_PPS;
        this.maxRadius = RIPPLE_MAX_RADIUS;
        this.distortionPhase = 0;

        const base = FG_LEADER_COLOR;
        const brightness = RIPPLE_BRIGHTNESS_BOOST;
        let [r, g, b] = [base[0] * brightness, base[1] * brightness, base[2] * brightness];
        const maxVal = Math.max(r, g, b);
        if (maxVal > 255) {
          const scale = 255 / maxVal;
          r *= scale; g *= scale; b *= scale;
        }
        this.targetColor = [Math.round(r), Math.round(g), Math.round(b)];
      }
    }

    class RippleManager {
      constructor(w, h) {
        this.width = w;
        this.height = h;
        this.activeRipples = [];
      }

      resize(w, h) { this.width = w; this.height = h; }

      _startNewRipple() {
        this.activeRipples.push(new Ripple(randInt(0, this.width), randInt(0, this.height)));
      }

      update(dt) {
        if (Math.random() < RIPPLE_CHANCE_PER_SECOND * dt) {
          this._startNewRipple();
        }
        const totalLifetime = (RIPPLE_FADE_IN_TIME_MS / 1000) + RIPPLE_FADE_OUT_TIME_S;
        for (let i = this.activeRipples.length - 1; i >= 0; i--) {
          const r = this.activeRipples[i];
          r.age += dt;
          r.currentRadius += r.speed * dt;
          r.distortionPhase = r.age * RIPPLE_DISTORTION_SPEED;
          if (r.age > totalLifetime || r.currentRadius > r.maxRadius) {
            this.activeRipples.splice(i, 1);
          }
        }
      }
    }

    // ============================================================================
    // COLUMN
    // ============================================================================

    class Column {
      constructor(x, screenHeight, config) {
        this.x = x;
        this.screenHeight = screenHeight;
        this.config = config;
        this.fontSize = config.fontSize;
        this.lineHeight = this.fontSize * config.lineHeightMultiplier;
        this.numChars = this.lineHeight > 0 ? Math.ceil(screenHeight / this.lineHeight) : 0;
        if (this.numChars <= 0) return;

        this.isFirstRun = true;
        this.characters = [];
        for (let i = 0; i < this.numChars; i++) {
          this.characters.push({
            y: i * this.lineHeight,
            value: config.charList[randInt(0, config.charList.length - 1)]
          });
        }
        this.dormantCounter = 0;
        this.leaderFlickerTimer = 0;
        this.trailLength = randInt(...config.lengthRange);

        this.cascadePosFloat = -1;
        this.targetCascadeColor = null;
        this.isCascadeDark = false;
        this.cascadeAge = 0;

        // Variable speed
        this.speedChangeTimer = 0;
        this.nextSpeedChange = randFloat(...SPEED_CHANGE_INTERVAL_RANGE);
        this.minSpeedPPS = 0;
        this.maxSpeedPPS = 0;

        this.leaderPosFloat = 0;
        this.speedPPS = 0;
        this.speedCPS = 0;
        this.flickerIntervalS = 0;
        this.gradientColors = [];

        this._resetStreak();
      }

      _resetStreak() {
        if (this.isFirstRun) {
          this.leaderPosFloat = -randInt(1, this.numChars);
          this.dormantCounter = randInt(...this.config.dormancyRange);
          this.isFirstRun = false;
        } else {
          this.leaderPosFloat = -randInt(0, this.trailLength);
          this.dormantCounter = 0;
        }

        const [minSpeed, maxSpeed] = this.config.speedRange;
        const biasExp = SPEED_DISTRIBUTION_BIAS > 0 ? 1.0 / SPEED_DISTRIBUTION_BIAS : 1.0;
        const normalizedSpeed = Math.random() ** biasExp;
        this.speedPPS = minSpeed + (maxSpeed - minSpeed) * normalizedSpeed;
        this.speedCPS = this.lineHeight > 0 ? this.speedPPS / this.lineHeight : 0;

        this.minSpeedPPS = minSpeed;
        this.maxSpeedPPS = maxSpeed;
        this.speedChangeTimer = 0;
        this.nextSpeedChange = randFloat(...SPEED_CHANGE_INTERVAL_RANGE);

        const curvedSpeed = normalizedSpeed ** FLICKER_SPEED_CURVE_EXPONENT;
        const dynamicIntervalMs = (1 - curvedSpeed) * SLOWEST_LEADER_FLICKER_INTERVAL_MS + curvedSpeed * FASTEST_LEADER_FLICKER_INTERVAL_MS;
        this.flickerIntervalS = dynamicIntervalMs / 1000;

        // Length bias toward shorter streaks
        const [minLen, maxLen] = this.config.lengthRange;
        const lengthBias = Math.random() ** 2.0;
        this.trailLength = Math.floor(minLen + (maxLen - minLen) * lengthBias);
        this.leaderFlickerTimer = 0;

        this.cascadePosFloat = -1;
        this._precomputeGradient(normalizedSpeed);
      }

      _precomputeGradient(normalizedSpeed) {
        if (this.trailLength <= 0) { this.gradientColors = []; return; }

        const leaderColor = this.config.leaderColor;
        const brightGreen = this.config.secondCharColor;
        const trailColor = this.config.trailColor;

        const bm = 1.0 + (normalizedSpeed * (LEADER_BRIGHTNESS_SPEED_MULTIPLIER - 1.0));
        const dynLeader = [
          Math.min(255, Math.round(leaderColor[0] * bm)),
          Math.min(255, Math.round(leaderColor[1] * bm)),
          Math.min(255, Math.round(leaderColor[2] * bm))
        ];

        const midBright = [
          (brightGreen[0] + trailColor[0]) >> 1,
          (brightGreen[1] + trailColor[1]) >> 1,
          (brightGreen[2] + trailColor[2]) >> 1
        ];
        const darkGreen = [trailColor[0] >> 1, trailColor[1] >> 1, trailColor[2] >> 1];

        const colorStops = [
          [0.00, dynLeader],
          [0.02, brightGreen],
          [0.15, brightGreen],
          [0.30, midBright],
          [0.50, trailColor],
          [0.75, darkGreen],
          [1.00, [0, 0, 0]]
        ];

        this.gradientColors = [];
        for (let i = 0; i < this.trailLength; i++) {
          const position = i / Math.max(1, this.trailLength - 1);
          if (i === 0) {
            this.gradientColors.push(dynLeader.slice());
          } else {
            let startStop = colorStops[0], endStop = colorStops[colorStops.length - 1];
            for (let j = 0; j < colorStops.length - 1; j++) {
              if (colorStops[j][0] <= position && position <= colorStops[j + 1][0]) {
                startStop = colorStops[j];
                endStop = colorStops[j + 1];
                break;
              }
            }
            let t = endStop[0] > startStop[0]
              ? (position - startStop[0]) / (endStop[0] - startStop[0])
              : 1.0;
            t = t * t * (3 - 2 * t); // smoothstep
            this.gradientColors.push(lerpColor(startStop[1], endStop[1], t));
          }
        }
      }

      triggerCascade(yPos, isDark) {
        if (this.cascadePosFloat !== -1 || this.dormantCounter > 0 || this.trailLength <= CASCADE_FADE_LENGTH * 2 + 5) return;
        if (this.lineHeight <= 0) return;
        const targetCharIdx = Math.round(yPos / this.lineHeight);
        if (targetCharIdx < 0 || targetCharIdx >= this.numChars) return;
        const leaderInt = Math.floor(this.leaderPosFloat);
        const hlStartPos = leaderInt - targetCharIdx;
        if (hlStartPos < 0 || hlStartPos >= this.trailLength) return;

        this.cascadePosFloat = hlStartPos;
        this.cascadeAge = 0;
        this.isCascadeDark = isDark;

        if (isDark) {
          this.targetCascadeColor = BACKGROUND_COLOR.slice();
        } else {
          const base = this.config.leaderColor;
          const br = CASCADE_BRIGHTNESS_BOOST;
          let [r, g, b] = [base[0] * br, base[1] * br, base[2] * br];
          const mx = Math.max(r, g, b);
          if (mx > 255) { const s = 255 / mx; r *= s; g *= s; b *= s; }
          this.targetCascadeColor = [Math.round(r), Math.round(g), Math.round(b)];
        }
      }

      updateAndDraw(ctx, dt, activeRipples) {
        if (this.numChars <= 0) return;

        if (this.dormantCounter > 0) {
          this.dormantCounter--;
          return;
        }

        // Variable speed
        if (VARIABLE_SPEED_ENABLED) {
          this.speedChangeTimer += dt;
          if (this.speedChangeTimer >= this.nextSpeedChange) {
            const speedRange = this.maxSpeedPPS - this.minSpeedPPS;
            const maxChange = speedRange * SPEED_CHANGE_AMOUNT;
            const speedDelta = randFloat(-maxChange, maxChange);
            this.speedPPS = clamp(this.speedPPS + speedDelta, this.minSpeedPPS, this.maxSpeedPPS);
            this.speedCPS = this.lineHeight > 0 ? this.speedPPS / this.lineHeight : 0;
            this.speedChangeTimer = 0;
            this.nextSpeedChange = randFloat(...SPEED_CHANGE_INTERVAL_RANGE);
          }
        }

        this.leaderFlickerTimer += dt;
        this.leaderPosFloat += this.speedCPS * dt;

        if (this.leaderPosFloat - this.trailLength > this.numChars) {
          this._resetStreak();
          return;
        }

        const leaderInt = Math.floor(this.leaderPosFloat);
        const startIdx = Math.max(0, leaderInt - this.trailLength + 1);
        const endIdx = Math.min(this.numChars, leaderInt + 2);

        for (let i = startIdx; i < endIdx; i++) {
          if (i < 0 || i >= this.numChars) continue;
          const ch = this.characters[i];
          const distFromLeader = leaderInt - i;

          if (distFromLeader < 0 || distFromLeader >= this.trailLength) continue;

          const isLeader = distFromLeader === 0;

          if (isLeader) {
            const [minSpd, maxSpd] = this.config.speedRange;
            let curNorm = maxSpd > minSpd ? (this.speedPPS - minSpd) / (maxSpd - minSpd) : 0.5;
            curNorm = clamp(curNorm, 0, 1);
            const curvedSpd = curNorm ** FLICKER_SPEED_CURVE_EXPONENT;
            const dynIntervalMs = (1 - curvedSpd) * SLOWEST_LEADER_FLICKER_INTERVAL_MS + curvedSpd * FASTEST_LEADER_FLICKER_INTERVAL_MS;
            const curFlickerInterval = dynIntervalMs / 1000;
            if (curFlickerInterval < dt || this.leaderFlickerTimer >= curFlickerInterval) {
              ch.value = this.config.charList[randInt(0, this.config.charList.length - 1)];
              if (this.leaderFlickerTimer >= this.flickerIntervalS) this.leaderFlickerTimer = 0;
            }
          } else {
            const baseFlicker = this.config.flickerChance;
            const distFactor = distFromLeader / this.trailLength;
            const flickerChance = baseFlicker + distFactor * baseFlicker * 2;
            if (Math.random() < flickerChance) {
              ch.value = this.config.charList[randInt(0, this.config.charList.length - 1)];
            }
          }

          let finalColor = this.gradientColors[distFromLeader].slice();

          // Cascade highlight
          if (this.cascadePosFloat !== -1) {
            const distFromHL = Math.abs(distFromLeader - Math.floor(this.cascadePosFloat));
            const haloSize = this.config.highlightHaloSize;
            if (distFromHL <= haloSize) {
              let haloFalloff = haloSize > 0 ? (haloSize - distFromHL) / haloSize : 1;
              let lifecycleFade = 1;
              const fadeLen = CASCADE_FADE_LENGTH;
              if (fadeLen > 0) {
                const distFromStart = (this.trailLength - 1) - this.cascadePosFloat;
                if (distFromStart < fadeLen) {
                  lifecycleFade = fadeLen > 1 ? distFromStart / (fadeLen - 1) : 1;
                } else if (this.cascadePosFloat < fadeLen) {
                  lifecycleFade = fadeLen > 1 ? this.cascadePosFloat / (fadeLen - 1) : 1;
                }
              }
              let finalIntensity = haloFalloff * lifecycleFade;
              const fadeInS = CASCADE_FADE_IN_TIME_MS / 1000;
              if (fadeInS > 0 && this.cascadeAge < fadeInS) {
                finalIntensity *= this.cascadeAge / fadeInS;
              }
              finalIntensity = clamp(finalIntensity, 0, 1);
              const tc = this.targetCascadeColor;
              finalColor = lerpColor(finalColor, tc, finalIntensity);
            }
          }

          // Ripple coloring
          for (const ripple of activeRipples) {
            const maxPossibleR = ripple.currentRadius + RIPPLE_DISTORTION_AMPLITUDE;
            if (Math.abs(this.x - ripple.originX) > maxPossibleR || Math.abs(ch.y - ripple.originY) > maxPossibleR) continue;

            const dx = this.x - ripple.originX;
            const dy = ch.y - ripple.originY;
            const distSq = dx * dx + dy * dy;

            const angle = Math.atan2(dy, dx);
            const distortion = Math.sin(angle * RIPPLE_DISTORTION_FREQUENCY + ripple.distortionPhase) * RIPPLE_DISTORTION_AMPLITUDE;
            const distortedRadius = ripple.currentRadius + distortion;

            if (distSq < distortedRadius * distortedRadius) {
              const dist = Math.sqrt(distSq);
              const proximityFade = distortedRadius > 0 ? 1.0 - dist / distortedRadius : 0;

              const fadeInS = RIPPLE_FADE_IN_TIME_MS / 1000;
              let lifecycleFade = 0;
              if (ripple.age < fadeInS) {
                const p = clamp(ripple.age / fadeInS, 0, 1);
                lifecycleFade = p * p * p;
              } else {
                const p = 1 - clamp((ripple.age - fadeInS) / RIPPLE_FADE_OUT_TIME_S, 0, 1);
                lifecycleFade = p * p * p;
              }

              const fi = clamp(proximityFade * lifecycleFade, 0, 1);
              finalColor = lerpColor(finalColor, ripple.targetColor, fi);
            }
          }

          // Quantize
          finalColor = quantizeColor(finalColor[0], finalColor[1], finalColor[2], COLOR_QUANTIZATION_STEP);

          // ========== Leader Glow via shadowBlur ==========
          if (isLeader) {
            ctx.shadowColor = 'rgba(180, 255, 200, 0.6)';
            ctx.shadowBlur = 8;
          }

          // Draw the character with vertical stretch
          const yPos = ch.y;
          ctx.fillStyle = colorToCSS(finalColor[0], finalColor[1], finalColor[2]);

          // Apply vertical stretch per character: translate to position, scale Y, draw at origin
          ctx.save();
          ctx.translate(this.x, yPos);
          ctx.scale(1, FONT_STRETCH_FACTOR);

          if (isLeader) {
            const boldOffset = this.config.isBold ? 1 : 0;
            ctx.fillText(ch.value, 0, 0);
            if (this.config.isBold) {
              ctx.fillText(ch.value, 1, 0);
            }
            for (let b = 0; b < LEADER_EXTRA_BOLDNESS; b++) {
              const off = Math.floor(b / 2) + 1;
              if (b % 2 === 0) {
                ctx.fillText(ch.value, boldOffset + off, 0);
              } else {
                ctx.fillText(ch.value, -off, 0);
              }
            }
          } else {
            ctx.fillText(ch.value, 0, 0);
            if (this.config.isBold) {
              ctx.fillText(ch.value, 1, 0);
            }
          }

          ctx.restore();

          // Reset shadow after leader
          if (isLeader) {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          }
        }

        // Update cascade position
        if (this.cascadePosFloat !== -1) {
          this.cascadePosFloat -= CASCADE_SPEED_CPS * dt;
          this.cascadeAge += dt;
          if (this.cascadePosFloat < 0) this.cascadePosFloat = -1;
        }
      }
    }

    // ============================================================================
    // CRT SCANLINE OVERLAY (drawn once to offscreen canvas)
    // ============================================================================

    function createCRTOverlay(w, h) {
      const offscreen = document.createElement('canvas');
      offscreen.width = w;
      offscreen.height = h;
      const octx = offscreen.getContext('2d');
      for (let y = 0; y < h; y += CRT_SCANLINE_SPACING) {
        const alpha = ((y / CRT_SCANLINE_SPACING | 0) % 2 === 0)
          ? CRT_SCANLINE_ALPHA / 255
          : (CRT_SCANLINE_ALPHA / 2) / 255;
        octx.fillStyle = `rgba(0,0,0,${alpha})`;
        octx.fillRect(0, y, w, 1);
      }
      return offscreen;
    }

    // ============================================================================
    // MAIN
    // ============================================================================

    (function main() {
      const canvas = document.getElementById('matrix');
      const ctx = canvas.getContext('2d');

      // Bloom canvas
      const bloomCanvas = document.getElementById('bloom');
      const bloomCtx = bloomCanvas.getContext('2d');


      let W, H;
      let columns = [];
      let cascadeManager;
      let rippleManager;
      let crtOverlay;
      let ripplesEnabled = RIPPLES_ENABLED;
      let cascadesEnabled = CASCADES_ENABLED;

      // FPS tracking for adaptive quality
      const fpsHistory = new Array(20).fill(60);

      function buildFont() {
        // Set the font on the context — will use @font-face MatrixFont
        ctx.font = `${FG_FONT_SIZE}px MatrixFont, monospace`;
        ctx.textBaseline = 'top';
      }

      function init() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        bloomCanvas.width = W;
        bloomCanvas.height = H;
        buildFont();

        const config = {
          fontSize: FG_FONT_SIZE,
          lineHeightMultiplier: FG_LINE_HEIGHT_MULTIPLIER,
          speedRange: FG_SPEED_RANGE,
          lengthRange: FG_LENGTH_RANGE,
          dormancyRange: FG_DORMANCY_RANGE,
          leaderColor: FG_LEADER_COLOR,
          trailColor: FG_TRAIL_COLOR,
          isBold: FG_IS_BOLD,
          flickerChance: FG_FLICKER_CHANCE,
          charList: FG_CHAR_LIST,
          highlightHaloSize: FG_HIGHLIGHT_HALO_SIZE,
          secondCharColor: FG_SECOND_CHAR_COLOR,
        };

        columns = [];
        for (let x = 0; x < W; x += FG_STREAM_SPACING) {
          columns.push(new Column(x, H, config));
        }

        cascadeManager = new HighlightCascadeManager(columns);
        rippleManager = new RippleManager(W, H);

        if (CRT_GRID_ENABLED) {
          crtOverlay = createCRTOverlay(W, H);
        }
      }

      // Debounced resize
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(init, 200);
      });

      // Wait for font to load then start
      document.fonts.ready.then(() => {
        init();

        let lastTime = performance.now();

        function frame(now) {
          const dt = Math.min((now - lastTime) / 1000, 0.1); // cap at 100ms
          lastTime = now;

          // --- Adaptive quality ---
          if (dt > 0) {
            const fps = 1 / dt;
            fpsHistory.shift();
            fpsHistory.push(fps);
            const avgFps = fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length;
            if (avgFps < ADAPTIVE_THRESHOLD) {
              if (ripplesEnabled) {
                ripplesEnabled = false;
                console.log(`Performance low (Avg FPS: ${avgFps.toFixed(1)}), disabling ripples.`);
              } else if (cascadesEnabled) {
                cascadesEnabled = false;
                console.log(`Performance low (Avg FPS: ${avgFps.toFixed(1)}), disabling cascades.`);
              }
            }
          }

          // Clear
          ctx.fillStyle = colorToCSS(...BACKGROUND_COLOR);
          ctx.fillRect(0, 0, W, H);

          // Set font each frame (in case of resize)
          buildFont();

          const activeRipples = ripplesEnabled ? rippleManager.activeRipples : [];

          // Update and draw columns
          for (const col of columns) {
            col.updateAndDraw(ctx, dt, activeRipples);
          }

          // Update managers
          if (cascadesEnabled) cascadeManager.update(dt);
          if (ripplesEnabled) rippleManager.update(dt);

          // Haze overlay
          // Screen blend haze — richer atmosphere than plain alpha
          if (HAZE_ENABLED) {
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = colorToCSS(HAZE_COLOR[0], HAZE_COLOR[1], HAZE_COLOR[2], HAZE_ALPHA / 255);
            ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'source-over';
          }

          // CRT scanlines
          if (CRT_GRID_ENABLED && crtOverlay) {
            ctx.drawImage(crtOverlay, 0, 0);
          }

          // ========== Bloom Pass ==========
          bloomCtx.clearRect(0, 0, W, H);
          bloomCtx.filter = 'blur(6px) brightness(1.5)';
          bloomCtx.drawImage(canvas, 0, 0);
          bloomCtx.filter = 'none';



          // FPS in title
          if (dt > 0) {
            document.title = `Matrix Rain FX (FPS: ${(1 / dt).toFixed(1)})`;
          }

          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      });
    })();
  </script>
